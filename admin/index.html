<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Админка — Kostanyan Learning Center</title>
  <link rel="stylesheet" href="/admin/shared.css">
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card">
      <h1>Админка</h1>
      <p>Общая защищённая основа готова. Разделы услуг и заявок подключаются отдельными задачами.</p>
      <nav class="admin-nav" aria-label="Разделы админки">
        <a class="admin-link secondary" href="/admin/services.html">Услуги</a>
        <a class="admin-link secondary" href="/admin/applications.html">Заявки</a>
        <button id="logout" type="button">Выйти</button>
      </nav>
    </section>
  </main>
  <script>
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.assign('/admin/login.html');
    });
  </script>
</body>
</html>

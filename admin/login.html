<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход владельца — Kostanyan Learning Center</title>
  <link rel="stylesheet" href="/admin/shared.css">
</head>
<body>
  <main class="admin-card login-card">
    <h1>Вход владельца</h1>
    <p class="muted">Тестовая админка. Доступ разрешён только одному владельцу.</p>
    <form id="login-form">
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required minlength="12"></label>
      <button type="submit">Войти</button>
      <p class="message" id="login-message" role="alert"></p>
    </form>
  </main>
  <script src="/admin/login.js" defer></script>
</body>
</html>
